[build-system]
requires = ["setuptools>=68,<69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm-qgis"
version = "0.1.1"
description = "Python package for mesoscale Hydrological Model"
readme = "README.md"
license = {text = "GPL-2.0"}
authors = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
maintainers = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
keywords = ["hydrology", "modeling", "mesoscale", "water", "environment", "qgis", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyproj>=3.0.0",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13.3",
    "mhm-tools>=0.3.0",
    "nml-tools[gui]",
    "qtpy",
    "guidata",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
viz = [
    "matplotlib>=3.3.0",
    "netCDF4>=1.5.0",
    "xarray>=0.19.0",
]
gui = [
    "PyQt5>=5.15",
]

[project.urls]
Homepage = "https://github.com/SanjeevBashyal/mhm-qgis"
Documentation = "https://github.com/SanjeevBashyal/mhm-qgis/wiki"
Repository = "https://github.com/SanjeevBashyal/mhm-qgis"
"Bug Tracker" = "https://github.com/SanjeevBashyal/mhm-qgis/issues"

[project.scripts]
mhm-qgis = "mhm_qgis.standalone.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mhm_qgis*"]

[tool.setuptools.package-data]
mhm_qgis = [
    "**/*.asc",
    "**/*.csv",
    "**/*.html",
    "**/*.md",
    "**/*.nc",
    "**/*.nml",
    "**/*.png",
    "**/*.qrc",
    "**/*.qm",
    "**/*.rst",
    "**/*.sh",
    "**/*.ts",
    "**/*.txt",
    "**/*.ui",
    "**/*.yml",
    "**/*.yaml",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
