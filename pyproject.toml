[build-system]
requires = ["setuptools>=68,<69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm-qgis"
dynamic = ["version"]
description = "Python package for mesoscale Hydrological Model"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
maintainers = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
keywords = ["hydrology", "modeling", "mesoscale", "water", "environment", "qgis", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyproj>=3.0.0",
    "pyqtgraph>=0.13.3",
    "pyflwdir>=0.5.12",
    "mhm==5.13.4",
    "mhm-tools>=0.3.0,<0.4",
    "nml-tools[gui]>=0.6.0,<0.7",
    "qtpy",
    "guidata",
    "netCDF4>=1.5.0",
    "xarray>=0.19.0",
    "rioxarray>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "twine",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
[project.urls]
Homepage = "https://github.com/SanjeevBashyal/mhm-qgis"
Documentation = "https://github.com/SanjeevBashyal/mhm-qgis/wiki"
Repository = "https://github.com/SanjeevBashyal/mhm-qgis"
"Bug Tracker" = "https://github.com/SanjeevBashyal/mhm-qgis/issues"

[project.scripts]
mhm-qgis = "mhm_qgis.runtime:launch"
mhm-qgis-runtime = "mhm_qgis.runtime:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mhm_qgis._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mhm_qgis*"]

[tool.setuptools.package-data]
mhm_qgis = [
    "metadata.txt",
    "requirements.txt",
    "settings.yaml",
    "nml-schemas/**/*.toml",
    "nml-schemas/**/*.yml",
    "runtime/*.json",
    "runtime/locks/*.lock",
    "**/*.png",
    "**/*.qm",
    "**/*.ui",
]

[tool.setuptools.exclude-package-data]
mhm_qgis = ["**/*.ipynb", "**/*.qrc"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
