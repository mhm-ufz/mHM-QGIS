[build-system]
requires = ["setuptools>=69.3,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhm-qgis"
dynamic = ["version"]
description = "Prepare, configure and run mHM 5.13 and v6 models in QGIS or as a standalone app"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
maintainers = [
    {name = "Sanjeev Bashyal", email = "sanjeev.bashyal@ufz.de"}
]
keywords = ["hydrology", "modeling", "mesoscale", "water", "environment", "qgis", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyproj>=3.0.0",
    "pyqtgraph>=0.13.3",
    "pyflwdir>=0.5.12",
    "mhm>=5.13.4,<5.14",  # the latest mHM 5.13 executable, as the `mhm` command
    "mhm-tools>=0.3.0,<0.4",
    "nml-tools[gui]>=0.6.0,<0.7",
    "qtpy",
    "guidata",
    "netCDF4>=1.5.0",
    "pyyaml>=5.4",
    "xarray>=0.19.0",
    "rioxarray>=0.13.0",
]

[project.optional-dependencies]
check = [
    "isort[colors]>=5.13",
    "ruff>=0.16,<0.17",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=3",
]
dev = [
    "build",
    "twine",
    "mhm-qgis[check,test]",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
[project.urls]
Homepage = "https://git.ufz.de/mhm/mhm-qgis"
Repository = "https://git.ufz.de/mhm/mhm-qgis"
"Bug Tracker" = "https://git.ufz.de/mhm/mhm-qgis/-/issues"

[project.scripts]
mhm-qgis = "mhm_qgis.runtime:launch"
mhm-qgis-runtime = "mhm_qgis.runtime:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "mhm_qgis._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mhm_qgis*"]

[tool.setuptools.package-data]
mhm_qgis = [
    "metadata.txt",
    "requirements.txt",
    "settings.yaml",
    "nml-schemas/**/*.toml",
    "**/*.yml",
    "runtime/*.json",
    "runtime/locks/*.lock",
    "**/*.png",
    "**/*.qm",
    "**/*.ui",
]

[tool.setuptools.exclude-package-data]
mhm_qgis = ["**/*.ipynb", "**/*.qrc"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    # rioxarray 0.19's own `Affine * Affine` under affine 3; not our code
    "ignore::PendingDeprecationWarning:rioxarray",
]

[tool.isort]
profile = "black"
multi_line_output = 3
known_first_party = ["mhm_qgis"]
known_third_party = ["qgis"]
skip_gitignore = true

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# mhm-tools' rule set without "I": isort is the only import sorter.
select = [
    "E", "F", "W", "B", "B904", "ARG", "C4", "EM", "ICN", "ISC", "PGH", "PIE",
    "PL", "PT", "PTH", "RET", "RUF", "SIM", "T20", "UP", "YTT", "D",
]
ignore = [
    "E501", "PLR2004", "PLC0415", "PLR0917",
    # Deferred families (ratchet): remove one per lint-<family> branch.
    "D", "EM", "PTH", "ARG",
    # NumPy 1.x round() of a float32 returns float32; int(round(x)) stays explicit.
    "RUF046",
]

[tool.ruff.lint.per-file-ignores]
"src/mhm_qgis/mhm_qgis.py" = ["E402"]           # sys.path is cleaned before the imports
"src/mhm_qgis/core/grid/__init__.py" = ["F401"] # facade re-exporting core/grid
"src/mhm_qgis/runtime/*" = ["T201"]             # console entry points
"tools/*" = ["T201"]
"tests/*" = ["T201", "PLW0603"]                 # subprocess scripts; QApplication singletons

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 20
max-statements = 80

[tool.ruff.lint.pydocstyle]
convention = "numpy"
