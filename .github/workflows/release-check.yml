# Release checks that cannot run locally: the private QGIS runtime on every platform.
# Per-push lint and tests run on GitLab (.gitlab-ci.yml).
name: release-check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

defaults:
  run:
    shell: bash

env:
  # Unreleased dependency, as in .gitlab-ci.yml (with the version pymhm pins): delete
  # once nml-tools 0.6 is on PyPI. mhm-tools 0.3 comes from PyPI.
  NML_TOOLS_GIT: "nml-tools[gui]@git+https://github.com/SanjeevBashyal/nml-tools.git@2ed3158"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/build_qgis_plugin.py
      - run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.6.0 python -m pip wheel --no-deps -w dist "$NML_TOOLS_GIT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y -qq libegl1 libxkbcommon0 libdbus-1-3
      - run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.6.0 python -m pip install "$NML_TOOLS_GIT"
      - run: python -m pip install -e .[full,test]
      - run: python -m pytest tests -q
        env:
          QT_QPA_PLATFORM: offscreen

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; check the Intel label is still offered.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install dist/*.whl
      - id: root
        run: echo "path=$(python -c 'from mhm_qgis_runtime import runtime_root; print(runtime_root())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.root.outputs.path }}/mamba/pkgs
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/mhm_qgis_runtime/locks/*.lock') }}
      - run: mhm-qgis-runtime install --yes
      - run: mhm-qgis-runtime status
      - run: mhm-qgis --help
      - name: mHM and the GUI inside the runtime
        env:
          GUI_SMOKE: |
            import sys
            from qgis.PyQt.QtCore import QTimer
            from mhm_qgis.qt.dialogs.mhm_qgis_main import MhmQgisDialog
            from mhm_qgis_runtime.app import main
            show_ = MhmQgisDialog.show
            def show_once(self):
                assert self.tabWidget_steps.count() == 6
                self.open_map_canvas()
                QTimer.singleShot(0, self.reject)
                return show_(self)
            MhmQgisDialog.show = show_once
            sys.exit(main([]))
        run: |
          python tools/run_in_runtime.py mhm --version
          python tools/run_in_runtime.py python -c "$GUI_SMOKE"
