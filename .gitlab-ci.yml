image: python:3.12

stages:
  - check
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: offscreen
  # --- Unreleased dependency: delete this and `.unreleased` once nml-tools 0.6 is on
  # PyPI (mhm-tools 0.3 is; it now comes from PyPI with pymhm).
  NML_TOOLS_GIT: "nml-tools[gui]@git+https://github.com/SanjeevBashyal/nml-tools.git@2ed3158"
  # ---

cache:
  key: pip
  paths:
    - .cache/pip

# A git checkout carries no matching version tag, so the build gets the version
# pymhm pins (hatch-vcs ignores SETUPTOOLS_SCM_PRETEND_VERSION_FOR_*).
.unreleased: &unreleased
  - SETUPTOOLS_SCM_PRETEND_VERSION=0.6.0 pip install "$NML_TOOLS_GIT"

.qt_libs: &qt_libs
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

isort:
  stage: check
  script:
    - pip install "isort[colors]>=5.13"
    - isort --check --diff --color .

ruff:
  stage: check
  script:
    - pip install "ruff>=0.16,<0.17"
    - ruff check src tests tools

test:
  stage: test
  when: always
  image: python:$PY
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  before_script:
    - *qt_libs
    - *unreleased
  script:
    - pip install -e .[full,test]
    - python -m pytest --cov mhm_qgis --cov-report term-missing --cov-report xml:cov.xml -o addopts="" -q tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cov.xml

build:
  stage: build
  when: always
  variables:
    GIT_DEPTH: 0
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - python tools/build_qgis_plugin.py
    # nml-tools for test-qgis (installed beside mhm-qgis, so the runtime repacks it);
    # drop with the unreleased block
    - SETUPTOOLS_SCM_PRETEND_VERSION=0.6.0 pip wheel --no-deps -w dist "$NML_TOOLS_GIT"
  artifacts:
    paths:
      - dist

# The full QGIS suite inside the private QGIS 3.44 runtime. It downloads a conda
# QGIS, so it runs on a schedule, on tags or by hand; the local QGIS suite is the
# per-stage gate.
test-qgis:
  stage: build
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    XDG_DATA_HOME: "$CI_PROJECT_DIR/.runtime"  # runtime_root() honours it on Linux
  before_script:
    - *qt_libs
  script:
    - pip install dist/*.whl
    - mhm-qgis-runtime install --yes
    - python tools/run_in_runtime.py python -m pip install pytest
    - python tools/run_in_runtime.py python -m pytest tests -q -o addopts="" -p no:cacheprovider
  cache:
    key:
      files:
        - src/mhm_qgis_runtime/locks/linux-64.lock
    paths:
      - .runtime/mhm-qgis/mamba/pkgs
