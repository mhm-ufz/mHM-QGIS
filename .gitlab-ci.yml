image: python:3.12

stages:
  - check
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: offscreen
  # --- Unreleased dependencies: delete this block once mhm-tools 0.3 and
  # nml-tools 0.6 are on PyPI. The pretend versions satisfy pymhm's pins.
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_MHM_TOOLS: "0.3.0"
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_NML_TOOLS: "0.6.0"
  UNRELEASED: >-
    mhm-tools@git+https://git.ufz.de/mhm/mhm-tools.git@3b77269
    nml-tools[gui]@git+https://github.com/SanjeevBashyal/nml-tools.git@f8d46cb
  # ---

cache:
  key: pip
  paths:
    - .cache/pip

.qt_libs: &qt_libs
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

isort:
  stage: check
  script:
    - pip install "isort[colors]>=5.13"
    - isort --check --diff --color .

ruff:
  stage: check
  script:
    - pip install "ruff>=0.16,<0.17"
    - ruff check src tests tools

test:
  stage: test
  when: always
  image: python:$PY
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  before_script:
    - *qt_libs
    - pip install $UNRELEASED
  script:
    - pip install -e .[test]
    - python -m pytest --cov mhm_qgis --cov-report term-missing --cov-report xml:cov.xml -o addopts="" -q tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cov.xml

build:
  stage: build
  when: always
  variables:
    GIT_DEPTH: 0
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - python tools/build_qgis_plugin.py
    - pip wheel --no-deps -w dist $UNRELEASED  # wheelhouse for test-qgis; drop with the block above
  artifacts:
    paths:
      - dist

# The full QGIS suite inside the private QGIS 3.44 runtime. It downloads a conda
# QGIS, so it runs on a schedule, on tags or by hand; the local QGIS suite is the
# per-stage gate.
test-qgis:
  stage: build
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    XDG_DATA_HOME: "$CI_PROJECT_DIR/.runtime"  # runtime_root() honours it on Linux
  before_script:
    - *qt_libs
  script:
    - pip install dist/*.whl
    - mhm-qgis-runtime install --yes --wheelhouse dist
    - python tools/run_in_runtime.py python -m pip install pytest
    - python tools/run_in_runtime.py python -m pytest tests -q -o addopts="" -p no:cacheprovider
  cache:
    key:
      files:
        - src/mhm_qgis/runtime/locks/linux-64.lock
    paths:
      - .runtime/mhm-qgis/mamba/pkgs
