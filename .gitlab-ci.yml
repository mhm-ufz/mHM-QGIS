image: python:3.12

# Pipelines run on demand, not on every push: the "Run pipeline" button, merge
# requests, schedules and tags.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG

stages:
  - check
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  QT_QPA_PLATFORM: offscreen

cache:
  key: pip
  paths:
    - .cache/pip

.qt_libs: &qt_libs
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

isort:
  stage: check
  script:
    - pip install "isort[colors]>=5.13"
    - isort --check --diff --color .

ruff:
  stage: check
  script:
    - pip install "ruff>=0.16,<0.17"
    - ruff check src tests tools

test:
  stage: test
  when: always
  image: python:$PY
  parallel:
    matrix:
      - PY: ["3.10", "3.13"]
  before_script:
    - *qt_libs
  script:
    - pip install -e .[full,test]
    - python -m pytest --cov mhm_qgis --cov-report term-missing --cov-report xml:cov.xml -o addopts="" -q tests/
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cov.xml

build:
  stage: build
  when: always
  variables:
    GIT_DEPTH: 0
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
    - python tools/build_qgis_plugin.py
  artifacts:
    paths:
      - dist

# The full QGIS suite inside the private QGIS 3.44 runtime. It downloads a conda
# QGIS, so it runs on a schedule, on tags or by hand; the local QGIS suite is the
# per-stage gate.
test-qgis:
  stage: build
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  variables:
    XDG_DATA_HOME: "$CI_PROJECT_DIR/.runtime"  # runtime_root() honours it on Linux
  before_script:
    - *qt_libs
  script:
    - pip install dist/*.whl
    - mhm-qgis-runtime install --yes
    - python tools/run_in_runtime.py python -m pip install pytest
    - python tools/run_in_runtime.py python -m pytest tests -q -o addopts="" -p no:cacheprovider
  cache:
    key:
      files:
        - src/mhm_qgis_runtime/locks/linux-64.lock
    paths:
      - .runtime/mhm-qgis/mamba/pkgs
