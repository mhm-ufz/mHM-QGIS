title: PET - Case -1
description: Parameters for PET (case -1 - LAI correction).
x-fortran-namelist: PETminus1
type: object
properties:
  PET_a_forest:
    $ref: parameter.yml#/$defs/parameter
    title: Potential evapotranspiration forest
    examples: [[0.3000, 1.3000, 0.3000, 1, 1]]
  PET_a_impervious:
    $ref: parameter.yml#/$defs/parameter
    title: Potential evapotranspiration impervious
    examples: [[0.3000, 1.3000, 0.8000, 1, 1]]
  PET_a_pervious:
    $ref: parameter.yml#/$defs/parameter
    title: Potential evapotranspiration pervious
    examples: [[0.3000, 1.3000, 1.3000, 1, 1]]
  PET_b:
    $ref: parameter.yml#/$defs/parameter
    title: Potential evapotranspiration b
    examples: [[0.0000, 1.5000, 1.5000, 1, 1]]
  PET_c:
    $ref: parameter.yml#/$defs/parameter
    title: Potential evapotranspiration c
    examples: [[-2.000, 0.0000, -0.700, 1, 1]]
required:
  - PET_a_forest
  - PET_a_impervious
  - PET_a_pervious
  - PET_b
  - PET_c
