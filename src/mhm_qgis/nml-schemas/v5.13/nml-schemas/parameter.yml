# Every v5.13 calibration parameter is this five-element Fortran array, so it
# is defined once here and referenced. The element order is the namelist
# contract mHM 5.13 parses; v6 replaces it with the `parameter_t` derived type.
$defs:
  parameter:
    title: Calibration parameter
    description: >-
      Lower bound, upper bound, value, calibration flag and scaling.
    type: array
    items:
      type: number
      x-fortran-kind: dp
    x-fortran-shape: 5
    x-nml-tools-ui:
      axes:
        "1":
          title: Parameter component
          labels: [Lower bound, Upper bound, Value, Flag, Scaling]
