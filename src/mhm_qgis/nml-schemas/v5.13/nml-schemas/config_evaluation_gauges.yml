title: Evaluation gauges
description: Gauging-station metadata used to evaluate routed discharge, organized by domain and gauge number.
x-fortran-namelist: evaluation_gauges
type: object
properties:
  nGaugesTotal:
    description: Total number of evaluation gauges across all modeled domains.
    type: integer
    minimum: 0
    default: 1
  NoGauges_domain:
    description: Number of evaluation gauges in each domain.
    type: array
    items:
      type: integer
      minimum: 0
    x-fortran-shape: nDomains
    examples: [[1]]
  Gauge_id:
    description: Consecutively listed gauge identifier for each domain and gauge position; identifiers must match the gauge-location grid.
    type: array
    items:
      type: integer
    x-fortran-shape: [nDomains, nGaugesTotal]
    examples: [[[398]]]
  gauge_filename:
    description: Name of the observed discharge time-series file for each domain and gauge position.
    type: array
    items:
      type: string
      x-fortran-len: buf
    x-fortran-shape: [nDomains, nGaugesTotal]
    examples: [[["00398.txt"]]]
