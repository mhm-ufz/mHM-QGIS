title: Inflow gauges
description: Gauges or grid cells supplying observed inflow from upstream areas outside a modeled domain.
x-fortran-namelist: inflow_gauges
type: object
properties:
  nInflowGaugesTotal:
    description: Total number of inflow gauges across all modeled domains.
    type: integer
    minimum: 0
    default: 0
  NoInflowGauges_domain:
    description: Number of inflow gauges in each domain.
    type: array
    items:
      type: integer
      minimum: 0
    x-fortran-shape: nDomains
    examples: [[0]]
  InflowGauge_id:
    description: Identifier of each inflow gauge, indexed by domain and gauge position.
    type: array
    items:
      type: integer
    x-fortran-shape: [nDomains, nGaugesTotal]
    examples: [[[-9]]]
  InflowGauge_filename:
    description: Name of the inflow time-series file for each domain and gauge position.
    type: array
    items:
      type: string
      x-fortran-len: buf
    x-fortran-shape: [nDomains, nGaugesTotal]
    examples: [[[""]]]
  InflowGauge_Headwater:
    description: Whether flows from upstream or headwater cells of each inflow gauge are included.
    type: array
    items:
      type: boolean
    x-fortran-shape: [nDomains, nGaugesTotal]
    examples: [[[false]]]
