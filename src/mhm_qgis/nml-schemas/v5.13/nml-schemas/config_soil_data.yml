title: Soil database and layers
description: Soil-database mode and mHM soil-layer geometry shared by all modeled domains.
x-fortran-namelist: soildata
type: object
properties:
  iFlag_soilDB:
    description: |-
      Soil-database mode.
      0: classical mHM database with soil_class.asc and soil_classdefinition.txt;
      provide depths for horizons 1 through n-1 because the last depth comes from the lookup table.
      1: harmonized horizon-specific database with soil_class_horizon_XX.asc and
      soil_classdefinition_iFlag_soilDB_1.txt; provide all horizon depths.
    type: integer
    enum: [0, 1]
    default: 0
  tillageDepth:
    description: Soil depth down to which organic matter is possible, in millimeters; in mode 1 it must coincide with a horizon boundary.
    type: integer
    default: 200
  nSoilHorizons_mHM:
    description: Number of soil horizons represented by mHM; version 5.13 supports at most ten.
    type: integer
    minimum: 1
    default: 2
  soil_Depth:
    description: |-
      Bottom depth of each supplied soil horizon relative to the ground surface, in millimeters and positive downward.
      In database mode 0 omit the final horizon depth because it is read from the soil lookup table;
      in mode 1 provide every horizon depth and a corresponding horizon-specific soil-class grid.
    type: array
    items:
      type: number
      exclusiveMinimum: 0
    x-fortran-shape: nSoilHorizons
    examples: [[200.0]]
