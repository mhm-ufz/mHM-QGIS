# One window layout per post-processing view (post plan §0b, revised §0c). Selecting a
# view in the Outputs tab's navigation list arranges the QGIS main window (or the
# standalone map window) like this; your later adjustments are remembered per view.
#
# central: a panel shown as a page over the map canvas (the canvas's own stacked
#          widget; the central widget is never replaced), or `canvas` for the map
#          canvas itself (Map Explorer draws on it).
# left:    side docks, tabbed with QGIS's Layers and Browser panels (tabs at the
#          bottom); the first is raised. `width` is the left area's width in pixels.
# right:   side docks on the right (tabbed together), `right_width` wide.
version: 2

panels:
  # name: [form, title]
  hydrograph:     [post_hydrograph_dock.ui, Hydrograph]
  water_balance:  [post_water_balance_dock.ui, Water balance]
  processes:      [post_processes_dock.ui, Processes]
  signatures:     [post_signatures_dock.ui, Signatures]
  events:         [post_events_dock.ui, Events]
  validation:     [post_validation_dock.ui, Validation]
  climatology:    [post_climatology_dock.ui, Climatology]
  compare_maps:   [post_compare_maps.ui, Compare maps]
  extremes:       [post_extremes_dock.ui, Extremes]
  drought:        [post_drought_dock.ui, Drought]
  anomalies:      [post_anomalies_dock.ui, Anomalies]
  summary:        [post_summary_dock.ui, Summary]

docks:
  map:            [post_map_dock.ui, Map]
  map_controls:   [post_map_controls_dock.ui, Map controls]
  cell_inspector: [post_cell_inspector_dock.ui, Cell inspector]
  compare:        [post_compare_dock.ui, Compare]
  why_here:       [post_why_here_dock.ui, "Why here?"]   # opened from a map's right-click menu

views:
  # title: the navigation entry it answers to
  map_explorer:  {title: Map Explorer,  central: canvas,        left: [map_controls], width: 340, right: [cell_inspector], right_width: 340}
  hydrograph:    {title: Hydrograph,    central: hydrograph,    left: [map], width: 380}
  water_balance: {title: Water balance, central: water_balance, left: [map], width: 420}
  processes:     {title: Processes,     central: processes,     left: [map, cell_inspector], width: 380}
  signatures:    {title: Signatures,    central: signatures,    left: [map], width: 380}
  events:        {title: Events,        central: events,        left: [map], width: 380}
  validation:    {title: Validation,    central: validation,    left: [map], width: 420}
  climatology:   {title: Climatology,   central: climatology,   left: [map], width: 380}
  compare:       {title: Compare,       central: compare_maps,  left: [compare], width: 420}
  extremes:      {title: Extremes,      central: extremes,      left: [map], width: 420}
  drought:       {title: Drought,       central: drought,       left: [map], width: 420}
  anomalies:     {title: Anomalies,     central: anomalies,     left: [map], width: 420}
  summary:       {title: Summary,       central: summary,       left: [map], width: 420}
